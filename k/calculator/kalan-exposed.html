<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employee Search</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, sans-serif;
    color: white;
  }

  .container {
    width: min(90%, 400px);
    text-align: center;
  }

  .language-toggle {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 30px;
  }

  .language-toggle button {
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    background: #2a2a2a;
    color: #aaa;
    font-size: 14px;
  }

  .language-toggle button.active {
    background: white;
    color: #121212;
    font-weight: 600;
  }

  label {
    display: block;
    text-align: left;
    margin-bottom: 10px;
    color: #ddd;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #1e1e1e;
    color: white;
    font-size: 16px;
    outline: none;
  }

  input:focus {
    border-color: #888;
  }

  .result {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: #1e1e1e;
    border-radius: 10px;
    text-align: left;
  }

  .processing {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 8px;
  }

  .entered-data {
    color: white;
    font-size: 16px;
    word-break: break-word;
  }
</style>
</head>

<body>

<div class="container">

  <div class="language-toggle">
    <button id="bgBtn" class="active" onclick="setLanguage('bg')">
      Български
    </button>
    <button id="enBtn" onclick="setLanguage('en')">
      English
    </button>
  </div>

  <label id="searchLabel">
    Въведете служебен номер или име и фамилия
  </label>

  <input
    type="text"
    id="employeeSearch"
    placeholder="Служебен номер, име или фамилия..."
    autocomplete="off"
  >

  <div class="result" id="result">
    <div class="processing" id="processingText">
      Обработва се...
    </div>
    <div class="entered-data" id="enteredData"></div>
  </div>

</div>

<script>
  const translations = {
    bg: {
      label: "Въведете служебен номер или име и фамилия",
      placeholder: "Служебен номер, име или фамилия...",
      processing: "Обработва се..."
    },
    en: {
      label: "Enter employee number, name or surname",
      placeholder: "Employee number, name or surname...",
      processing: "Processing..."
    }
  };

  let currentLanguage = "bg";

  function setLanguage(lang) {
    currentLanguage = lang;

    document.documentElement.lang = lang;

    document.getElementById("searchLabel").textContent =
      translations[lang].label;

    document.getElementById("employeeSearch").placeholder =
      translations[lang].placeholder;

    document.getElementById("processingText").textContent =
      translations[lang].processing;

    document.getElementById("bgBtn").classList.toggle(
      "active",
      lang === "bg"
    );

    document.getElementById("enBtn").classList.toggle(
      "active",
      lang === "en"
    );
  }

  const input = document.getElementById("employeeSearch");

  function showProcessing() {
    const value = input.value.trim();

    if (!value) return;

    document.getElementById("enteredData").textContent = value;
    document.getElementById("result").style.display = "block";
  }

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      showProcessing();
    }
  });

  input.addEventListener("blur", showProcessing);
</script>

<script>
  fetch("https://visitor-tracker.arbri-gjylbegaj.workers.dev", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      page: window.location.pathname
    })
  }).catch(() => {});
</script>
</body>
</html>
